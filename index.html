<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Links</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    h1 {
      margin-bottom: 24px;
      font-size: 1.5rem;
    }
    .link-btn {
      display: block;
      width: 100%;
      max-width: 320px;
      padding: 14px 20px;
      margin: 8px 0;
      background-color: #21262d;
      color: #58a6ff;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #30363d;
      font-weight: 600;
      box-sizing: border-box;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .link-btn:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }
  </style>
</head>
<body>
  <h1>@yourusername</h1>

  <a href="https://yourwebsite.com" class="link-btn" target="_blank">My Website</a>
  <a href="https://linkedin.com/in/yourprofile" class="link-btn" target="_blank">LinkedIn</a>
  <a href="https://x.com/yourusername" class="link-btn" target="_blank">X / Twitter</a>
  <a href="https://youtube.com/yourchannel" class="link-btn" target="_blank">YouTube</a>
</body>
</html>
