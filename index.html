      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);

      box-sizing: border-box;

    .link-btn:hover {

      border-color: rgba(255, 255, 255, 0.5);
